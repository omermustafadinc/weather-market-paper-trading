# Otonom toplayıcı.
#
# Neden burada koşuyor: Kalshi API'si geliştirme makinesinin bulunduğu ağdan
# erişilemiyor (ISP seviyesinde engel, bkz. DECISIONS.md). Actions runner'ları
# erişebiliyor — smoke.yml bunu ölçtü.
#
# Ham veri repoya commit'leniyor: append-only JSONL, git ile iyi çalışıyor ve
# SQLite ondan her an yeniden kurulabiliyor (`python -m wxbot.ingest`).
name: collect

on:
  schedule:
    # Saatte DÖRT tetikleme denemesi, ama veri slotu 30 dakika.
    #
    # Neden fazladan deneme: GitHub'ın schedule event'i sözleşme değil,
    # "best-effort" — event'ler gecikiyor ve düşüyor (bu repoda ilk 3 pencere
    # boş geçti). Fazladan deneme BEDAVA çünkü collector idempotent: aynı
    # slotta ikinci kez koşmak tek satır bile yazmıyor. Yani :22 ve :52
    # tetiklemeleri, :07 ve :37 düşerse devreye giren yedek; düşmezse
    # saniyeler süren no-op.
    #
    # Saat başından kaçınıyoruz: yoğun dakikalarda gecikme daha fazla.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Üst üste binen koşular aynı dosyaya yazıp push çakışması yaratmasın.
# Devam edeni iptal ETMİYORUZ: yarıda kesilen bir koşu eksik veri bırakır.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .

      - name: Git kimliği
        run: |
          git config user.name  "wxbot-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bir koşuda İKİ döngü. Sebebi ölçüm: GitHub'ın schedule event'i bu
      # repoda 8.7 saatte ~35 pencereden 1'ini tetikledi (~%3). Tetikleme
      # sıklığını kontrol edemiyoruz; her tetiklemeyi daha değerli yapıyoruz.
      # Veri her döngüden sonra commit'leniyor: koşu yarıda kesilirse ilk
      # döngünün verisi kaybolmasın.
      - name: Döngüler (topla -> karar -> 45sn -> kitap -> fill -> doğrula)
        run: |
          python -m wxbot.cycle --cycles 2 --gap-seconds 1500 \
            --commit-cmd 'bash .github/commit-data.sh'

      # Çözümleme koşu başına bir kez (döngü başına değil): 7 şehir × ~15 CLI
      # ürünü çekiyor, her döngüde tekrarlamak gereksiz yük olurdu.
      - name: Çözümle (NWS CLI ile sonuçları kapat)
        if: always()
        run: |
          python -m wxbot.ingest --db /tmp/wx.db --rebuild --quiet
          python -m wxbot.settle --db /tmp/wx.db

      - name: Rapor
        if: always()
        run: |
          python -m wxbot.ingest --db /tmp/wx.db --rebuild --quiet
          python -m wxbot.report --db /tmp/wx.db --lead-hours 8 --out REPORT.md
          cat REPORT.md

      - name: Kalan veriyi ve raporu commit'le
        if: always()
        run: |
          git add -A data/raw REPORT.md 2>/dev/null || true
          bash .github/commit-data.sh
