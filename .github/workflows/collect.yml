# Otonom toplayıcı.
#
# Neden burada koşuyor: Kalshi API'si geliştirme makinesinin bulunduğu ağdan
# erişilemiyor (ISP seviyesinde engel, bkz. DECISIONS.md). Actions runner'ları
# erişebiliyor — smoke.yml bunu ölçtü.
#
# Ham veri repoya commit'leniyor: append-only JSONL, git ile iyi çalışıyor ve
# SQLite ondan her an yeniden kurulabiliyor (`python -m wxbot.ingest`).
name: collect

on:
  schedule:
    # Saatte DÖRT tetikleme denemesi, ama veri slotu 30 dakika.
    #
    # Neden fazladan deneme: GitHub'ın schedule event'i sözleşme değil,
    # "best-effort" — event'ler gecikiyor ve düşüyor (bu repoda ilk 3 pencere
    # boş geçti). Fazladan deneme BEDAVA çünkü collector idempotent: aynı
    # slotta ikinci kez koşmak tek satır bile yazmıyor. Yani :22 ve :52
    # tetiklemeleri, :07 ve :37 düşerse devreye giren yedek; düşmezse
    # saniyeler süren no-op.
    #
    # Saat başından kaçınıyoruz: yoğun dakikalarda gecikme daha fazla.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Üst üste binen koşular aynı dosyaya yazıp push çakışması yaratmasın.
# Devam edeni iptal ETMİYORUZ: yarıda kesilen bir koşu eksik veri bırakır.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .

      - name: Topla (karar anı)
        run: python -m wxbot.collect

      # Karar ile fill arasındaki gecikmeyi SİMÜLE etmiyoruz, gerçekten
      # yaşıyoruz: 45 saniye sonra kitabı yeniden çekiyoruz. Faz 4'te fill
      # bu ikinci kitaba karşı hesaplanacak, yani aradaki fiyat hareketi
      # uydurma değil gerçek olacak.
      - name: 45 sn bekle
        run: sleep 45

      - name: Topla (fill anı — yalnızca orderbook)
        run: python -m wxbot.collect --purpose fill --markets-only

      - name: Doğrula (ham veriden SQLite kur + lookahead denetimi)
        run: |
          python -m wxbot.ingest --db /tmp/verify.db --rebuild --quiet
          echo "ingest ve lookahead denetimi geçti"

      - name: Ham veriyi commit'le
        run: |
          if [ -z "$(git status --porcelain data/raw)" ]; then
            echo "değişiklik yok"
            exit 0
          fi
          git config user.name  "wxbot-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "veri: $(date -u '+%Y-%m-%dT%H:%MZ') toplama"

          # Eşzamanlı bir koşu araya girmiş olabilir; ham veri append-only
          # olduğu için rebase güvenli.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push denemesi $i başarısız, tekrar deneniyor"
            sleep 5
          done
          echo "push başarısız" >&2
          exit 1
