[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbot"
version = "0.1.0"
description = "Hava durumu tahmin piyasalarında kâğıt üzerinde işlem yapan araştırma ajanı"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "certifi>=2024.7.4", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxbot = ["*.sql"]
